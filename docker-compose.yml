services:
  sentora:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentora_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-1.5-flash}
      - CORS_ORIGIN=*
